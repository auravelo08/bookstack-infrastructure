---
jump:
  hosts:
    bastion:
      ansible_host: "51.21.131.18"
      ansible_port: 2026
      ansible_user: "bastion"

all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "~/.ssh/bs-caps-project.pem"
    ansible_ssh_extra_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-rsa"

  children:
    prive:
      hosts:
        swarm-master:
          ansible_host: 10.0.173.62
        swarm-worker-1:
          ansible_host: 10.0.181.58
        swarm-worker-2:
          ansible_host: 10.0.161.55
        gitlab-runner:
          ansible_host: 10.0.173.47

      vars:
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o UserKnownHostsFile=/dev/null
          -o PubkeyAcceptedKeyTypes=+ssh-rsa
          -o ProxyCommand="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAcceptedKeyTypes=+ssh-rsa -p 2026 -W %h:%p -q -i ~/.ssh/bs-caps-project.pem bastion@51.21.131.18"
