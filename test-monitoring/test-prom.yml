---
- name: Installation de Docker et Docker Compose
  hosts: all
  become: yes

  tasks:
    # 1. Nettoyage et Prérequis
    - name: Mettre à jour le cache apt
      ansible.builtin.apt:
        update_cache: yes

    - name: Installer les outils système nécessaires
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    # 2. Configuration du dépôt officiel Docker
    - name: Créer le répertoire pour les clés GPG
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajouter la clé GPG officielle de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Ajouter le dépôt Docker à APT
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable"
        state: present
        filename: docker

    # 3. Installation de Docker Engine et du plugin Compose
    - name: Installer Docker et ses composants
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin # C'est le Docker Compose V2 moderne
        state: present
        update_cache: yes

    # 4. Configuration des droits
    - name: S'assurer que le groupe docker existe
      ansible.builtin.group:
        name: docker
        state: present

    - name: Ajouter l'utilisateur ubuntu au groupe docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Démarrer le service Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: yes

    # 1. Créer le dossier de destination sur l'EC2
    - name: Créer le répertoire pour le monitoring
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    # 2. Envoyer le fichier docker-compose.yml
    - name: Copier le fichier docker-compose.yml
      ansible.builtin.copy:
        src: ./docker-compose.yml
        dest: /opt/monitoring/docker-compose.yml
        mode: '0644'

    # 3. Envoyer le fichier prometheus.yml
    - name: Copier la configuration Prometheus
      ansible.builtin.copy:
        src: ./prometheus.yml
        dest: /opt/monitoring/prometheus.yml
        mode: '0644'

    # 4. Lancer les conteneurs (Docker Compose)
    - name: Lancer le stack via Docker Compose
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: /opt/monitoring