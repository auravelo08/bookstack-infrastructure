scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          app: "prometheus"

  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          app: "node-exporter"

  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']
        labels:
          app: "grafana"
