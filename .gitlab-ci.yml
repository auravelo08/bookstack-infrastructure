stages:
    - infracost
    - deploy

deploy-infracost:
    stage: infracost
    image: alpine:latest
    variables:
        INFRACOST_API_KEY: $INFRACOST_API_KEY
    script:
        - apk add --no-cache curl tar
        - export INFRACOST_VERSION="0.10.44" # Utiliser une version spécifique et stable
        - echo "Installation de infracost version ${INFRACOST_VERSION}..."
        - curl -sL "https://github.com/infracost/infracost/releases/download/v${INFRACOST_VERSION}/infracost-linux-amd64.tar.gz" -o /tmp/infracost.tar.gz
        - tar -xzf /tmp/infracost.tar.gz -C /tmp
        - chmod +x "/tmp/infracost-linux-amd64"
        - mkdir -p $HOME/bin
        - mv "/tmp/infracost-linux-amd64" "$HOME/bin/infracost"
        - export PATH="$HOME/bin:$PATH"
        - echo "$HOME/bin" >> $CI_PROJECT_DIR/.gitlab.env # Persister le PATH pour la suite du job
        - infracost --version
        - infracost breakdown --path=.
    tags:
        - bookstack-runner
    # rules:
    #     - if: $CI_COMMIT_BRANCH == "main"
    #       when: always

deploy-infra:
    stage: deploy
    image: hashicorp/terraform:latest
    variables:
        TF_IN_AUTOMATION: "true"  # Indique à Terraform qu'il tourne en CI
    script:
        - terraform init 
        - terraform fmt 
        - terraform validate
        - terraform plan -lock=false
        # - terraform apply -lock=false -auto-approve
    tags:
        - bookstack-runner
    # rules:
    #     - if: $CI_COMMIT_BRANCH == "main"
    #       when: always
    #
