stages:
  - infracost
  - deploy

infracost-breakdown:
  stage: infracost
  image: 
    name: infracost/infracost:latest # Utilise l'image officielle Infracost
    entrypoint: [""] # Permet d'exécuter les commandes Infracost directement
  variables:
    INFRACOST_API_KEY: $INFRACOST_API_KEY # Assurez-vous qu'elle est dans GitLab
  script:
    - infracost breakdown --path=. --format=json --out-file=infracost.json
    - infracost output --path infracost.json --format table
  tags:
    - bs-runner-3
#   rules:
#     - if: $CI_COMMIT_BRANCH == "main"

deploy-infrastructure:
  stage: deploy
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""] # GitLab lance le conteneur automatiquement
  script:
    - terraform init
    - terraform fmt -check
    - terraform validate
    - terraform plan -lock=false -input=false
  variables:
    # On définit la région ici pour Terraform
    AWS_DEFAULT_REGION: "eu-north-1"
    # Note : Les variables TF_VAR_ configurées dans GitLab 
    # sont injectées automatiquement dans le conteneur.
  tags:
    - bs-runner-3
#   rules:
#     - if: $CI_COMMIT_BRANCH == "main"