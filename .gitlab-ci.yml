default:
  tags:
    - bs-runner-3

stages:
  - infracost
  - approval
  - deploy

infracost-breakdown:
  stage: infracost
  image:
    name: infracost/infracost:ci-0.10
    entrypoint: [""]
  script:
    - infracost breakdown --path=. --format=json --out-file=infracost.json
    - infracost breakdown --path=. --format=table
  artifacts:
    paths:
      - infracost.json
    expire_in: 1 week

cost-approval:
  stage: approval
  script:
    - echo "Le coût a été analysé. Veuillez vérifier les logs du job 'infracost-breakdown' avant d'approuver."
  when: manual
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-infrastructure:
  stage: deploy
  image:
    name: hashicorp/terraform:1.9.0
    entrypoint: [""]
  script:
    - terraform init
    - terraform fmt -check
    - terraform validate
    - terraform plan -lock=false
    # - terraform apply -lock=false -auto-approve
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
