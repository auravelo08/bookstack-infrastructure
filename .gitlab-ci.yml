deploy-infra:
  stage: deploy
  image: 
    name: hashicorp/terraform:latest
    entrypoint: [""]
  id_tokens:
    TERRAFORM_TOKEN:
      aud: $CI_SERVER_URL
  variables:
    TF_IN_AUTOMATION: "true"
  before_script:
    - export TF_HTTP_USERNAME=$CI_PROJECT_ID
    - export TF_HTTP_PASSWORD=$TERRAFORM_TOKEN
    
  script:
    - terraform init
    - terraform fmt -check
    - terraform validate
    - terraform plan -lock=false
    # - terraform apply -lock=false -auto-approve
  tags:
    - bs-runner-2
