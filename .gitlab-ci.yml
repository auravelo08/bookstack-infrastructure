stages:
  - infracost
  - deploy

infracost-breakdown:
  stage: infracost
  image: 
    name: infracost/infracost:latest
    entrypoint: [""]
  script:
    # On s'assure de ne pas scanner les dossiers cachés inutiles si possible
    - infracost breakdown --path=. --format=json --out-file=infracost.json --exclude-path .terraform
    - infracost output --path infracost.json --format table
  tags:
    - bs-runner-3
#   rules:
#     - if: $CI_COMMIT_BRANCH == "main"

deploy-infrastructure:
  stage: deploy
  image:
    name: hashicorp/terraform:1.7
    entrypoint: [""]
  variables:
    AWS_DEFAULT_REGION: "eu-north-1"
    # On supprime TF_CLI_ARGS_init car il peut causer des erreurs de syntaxe invisibles
  script:
    - terraform init -input=false -no-color
    - terraform fmt -check
    - terraform validate
    - terraform plan -input=false -lock=false -no-color
  tags:
    - bs-runner-3
