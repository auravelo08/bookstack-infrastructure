stages:
  - infracost
  - deploy

# 1. Job d'analyse des coûts (Infracost)
infracost-check:
  stage: infracost
  image: alpine:latest
  variables:
    INFRACOST_API_KEY: $INFRACOST_API_KEY
    # Optionnel : Limite d'augmentation de coût en % (ex: 10% = 0.10)
    # INFRACOST_DIFF_LIMIT: "0.10" 
  script:
    # Installation des dépendances nécessaires
    - apk add --no-cache curl unzip tar
    # Téléchargement et installation de la dernière version d'Infracost
    - curl -sSL https://raw.githubusercontent.com/infracost/infracost/master/scripts/install.sh | sh
    # Exécution de l'analyse
    # --path=. analyse le dossier racine. Si vos fichiers .tf sont dans un sous-dossier, changez le chemin.
    - infracost breakdown --path=. --format json --out-file infracost-output.json
    # Affichage d'un résumé lisible dans les logs
    - infracost format --path infracost-output.json
    # (Optionnel) Vérification des limites de coût si la variable INFRACOST_DIFF_LIMIT est définie
    # - infracost diff --path=. --format json --out-file infracost-diff.json
    # - infracost diff --path=. --format table
  artifacts:
    paths:
      - infracost-output.json
    expire_in: 1 week
#   rules:
#     - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#     - if: $CI_COMMIT_BRANCH == "main"
  tags:
    - bookstack-runner

# 2. Job de déploiement (Terraform)
deploy-infra:
  stage: deploy
  image: hashicorp/terraform:latest
  variables:
    TF_IN_AUTOMATION: "true"
  script:
    - terraform init
    - terraform fmt
    - terraform validate
    - terraform plan -lock=false
    # Décommentez la ligne ci-dessous pour activer le déploiement réel
    # - terraform apply -lock=false -auto-approve
  tags:
    - bookstack-runner
#   rules:
#     - if: $CI_COMMIT_BRANCH == "main"