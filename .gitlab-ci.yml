stages:
  - infracost
  # - deploy

variables:
  INFRACOST_API_KEY: $INFRACOST_API_KEY

infracost-breakdown:
  stage: infracost
  image:
    name: infracost/infracost:ci-0.10
    entrypoint: [""]
  script:
    - echo "KEY=${INFRACOST_API_KEY}"
    - infracost breakdown --path=. --format=json --out-file=infracost.json
  tags:
    - bookstack-runner

