stages:
  - infracost
  # - deploy

variables:
  INFRACOST_API_KEY: $INFRACOST_API_KEY

infracost-breakdown:
  stage: infracost
  image: infracost/infracost:ci-0.10
  script:
    - infracost breakdown --path=. --format=json --out-file=infracost.json
    - infracost diff --path=. --compare-to=main --format=json --out-file=infracost_diff.json
    # - infracost comment gitlab --path=infracost_diff.json --behavior=update
    - infracost diff --path=. --compare-to=main --threshold-percent=10
  # rules:
  #   - if: $CI_MERGE_REQUEST_IID
  tags:
    - bookstack-runner

