stages:
  - infracost
  - deploy

# 1. Job d'analyse des coûts (Infracost)
infracost-check:
  stage: infracost
  image:  infracost/infracost:ci-0.10
  variables:
    INFRACOST_API_KEY: $INFRACOST_API_KEY
  script:
    - infracost breakdown --path=.
  tags:
    - bookstack-runner
# 2. Job de déploiement (Terraform)
deploy-infra:
  stage: deploy
  image: hashicorp/terraform:latest
  variables:
    TF_IN_AUTOMATION: "true"
  script:
    - terraform init
    - terraform fmt
    - terraform validate
    - terraform plan -lock=false
    # - terraform apply -lock=false -auto-approve
  tags:
    - bookstack-runner
#   rules:
#     - if: $CI_COMMIT_BRANCH == "main"