deploy-infra:
  stage: deploy
  image: 
    name: hashicorp/terraform:latest
    entrypoint: [""]
  variables:
    TF_IN_AUTOMATION: "true"
    
  script:
    - terraform init
    - terraform fmt -check
    - terraform validate
    - terraform plan -lock=false
    # - terraform apply -lock=false -auto-approve
  tags:
    - bookstack-runner
