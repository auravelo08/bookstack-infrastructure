default:
  tags:
    - bs-runner-3

stages:
  - infracost
  - deploy

infracost-breakdown:
  stage: infracost
  image:
    name: infracost/infracost:ci-0.10
    entrypoint: [""]

  script:
    - echo $INFRACOST_API_KEY
    - infracost breakdown --path=. --format=json --out-file=infracost.json
  # rules:
  #   - if: $CI_COMMIT_BRANCH == "main"

deploy-infrastructure:
  stage: deploy
  image: hashicorp/terraform:1.9.0
  before_script:
    - echo $TF_HTTP_USERNAME
    - echo $TF_HTTP_PASSWORD
  script:
    - terraform init
    - terraform fmt -check
    - terraform validate
    - terraform plan -lock=false

  # rules:
  #   - if: $CI_COMMIT_BRANCH == "main"
